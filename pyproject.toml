[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iso13849-pl-calc"
version = "0.1.0"
description = "ISO 13849-1 Performance Level calculator (simplified procedure) with markdown reports"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Tsadi Shvo"}]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
iso13849-pl = "iso13849_pl.cli:main"

[tool.setuptools]
packages = ["iso13849_pl"]
